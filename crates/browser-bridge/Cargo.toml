[package]
name = "cua-browser-bridge"
version = "0.1.0"
edition = "2021"
description = "Local browser bridge for cua: the daemon behind `cua browser` and its in-process client"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "io-util", "process"] }
tokio-tungstenite = "0.24"
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
sha2 = "0.10"
base64 = "0.22"
getrandom = "0.2"
# tunnel relay poll/response (blocking HTTP client)
ureq = { version = "2", default-features = false, features = ["tls", "gzip", "json"] }
