[package]
name = "cua"
version = "0.1.0"
edition = "2021"
description = "cua - Windows computer-use CLI (fusion of Trae / Qoder / ZCode designs)"

[features]
default = ["candle"]
# Pure-Rust Florence decoder (KV cache); the default caption backend.
candle = ["dep:candle-core", "dep:candle-nn"]
# CubeCL CUDA backend for the YOLO detector. Needs the CUDA toolkit (NVRTC)
# at runtime; the detector falls back to WGPU when the device is unavailable.
cuda = ["burn/cuda"]
# Runtime kernel autotuning (Burn/CubeCL). With CUDA it is the difference
# between the ~1 TFLOPS direct conv and ~10x that, paid for by ~30-40 s of
# candidate compilation on the first call in each process. On WGPU it is a
# ~2x speedup with a ~20 s first call. `install.ps1 -Autotune` selects it.
autotune = ["burn/autotune"]

[[bin]]
name = "florence_bench"
path = "src/bin/florence_bench.rs"
required-features = ["candle"]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
uiautomation = "0.16"
tract-onnx = { version = "0.21", default-features = false }
tokenizers = { version = "0.22", default-features = false, features = ["fancy-regex"] }
sha2 = "0.11.1"
regex = "1.13.1"
rayon = "1.12.0"
burn = { version = "0.22", default-features = false, features = ["std", "wgpu", "flex"] }
burn-store = { version = "0.22", default-features = false, features = ["std"] }
hex = "0.4.3"
# CommandFlow-rs' PaddleOCR engine (RapidOCR PP-OCRv4, ORT backend).
paddle-ocr-rs = { git = "https://github.com/caojiachen1/paddle-ocr-rs", rev = "74c120bd5c25404dc9487781a86b28d3a9959e98" }
# paddle-ocr-rs 0.7 expects the rc.12 ORT API; newer rc.15 pre-releases are
# semver-compatible and would otherwise be selected.
ort = { version = "=2.0.0-rc.12", default-features = false }
candle-core = { version = "0.9.2", optional = true }
candle-nn = { version = "0.9.2", optional = true }
imageproc = "0.25"
ab_glyph = "0.2"
ureq = "2"

[dependencies.windows]
version = "0.58"
features = [
  "Win32_Foundation",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_Graphics_Gdi",
  "Win32_Graphics_Dwm",
  "Win32_System_Threading",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_DataExchange",
  "Win32_System_Memory",
  "Win32_System_Ole",
  "Win32_System_Registry",
  "Win32_System_Com",
  "Win32_System_Console",
  "Win32_UI_Shell",
  "Win32_UI_HiDpi",
  "Win32_Security",
  "Win32_System_StationsAndDesktops",
  "Win32_System_JobObjects",
  "Win32_System_LibraryLoader",
  "Win32_Storage_Xps",
  "Foundation",
  "Foundation_Collections",
  "Globalization",
  "Graphics_Imaging",
  "Media_Ocr",
  "Storage_Streams",
]

[profile.release]
opt-level = 2
lto = false

# wgpu-hal 30 uses windows 0.62; gpu-allocator's broad range otherwise
# resolves to 0.59 and the D3D12 types no longer unify. The vendored copy only
# narrows that dependency range (no code changes).
[patch.crates-io]
gpu-allocator = { path = "vendor-gpu-allocator" }
